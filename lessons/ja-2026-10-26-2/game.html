<style>
/* Layout: pond-side scoreboard — one big stage card (question) beside a reed-thin ledger of players; stacks on phones. */
:root {
  --bg: #e7ede6;          /* pale reed water */
  --surface: #f6f8f3;
  --surface-2: #dbe3d9;
  --fg: #1b2620;
  --muted: #56645b;
  --line: #c3cfc2;
  --mud: #6e5a3a;          /* 泥 */
  --mud-soft: #e3d8c2;
  --gold: #a87a0c;         /* 黄金 */
  --gold-soft: #f3e4b4;
  --good: #2f7a4b;
  --bad: #b23a2e;
  --c0: #2c6e8f; --c1: #8a4f9e; --c2: #3d8a5a; --c3: #b0632a;  /* ア イ ウ エ */
  --display: "Zen Antique", "Hiragino Mincho ProN", "Noto Serif JP", serif;
  --body: "IBM Plex Sans KR", "Zen Kaku Gothic New", "Apple SD Gothic Neo", system-ui, sans-serif;
  --jp: "Zen Kaku Gothic New", "Hiragino Sans", "IBM Plex Sans KR", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111915; --surface: #18231d; --surface-2: #213028; --fg: #e4ebe4; --muted: #97a79c; --line: #2f4136;
  --mud: #c2a578; --mud-soft: #3a3223; --gold: #e2b43f; --gold-soft: #3d3218; --good: #5cbf80; --bad: #ec7366;
  --c0: #5aa8cf; --c1: #bb84cc; --c2: #6cc08a; --c3: #e0925a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111915; --surface: #18231d; --surface-2: #213028; --fg: #e4ebe4; --muted: #97a79c; --line: #2f4136;
  --mud: #c2a578; --mud-soft: #3a3223; --gold: #e2b43f; --gold-soft: #3d3218; --good: #5cbf80; --bad: #ec7366;
  --c0: #5aa8cf; --c1: #bb84cc; --c2: #6cc08a; --c3: #e0925a; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
#app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.jp { font-family: var(--jp); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
input, textarea, select { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
label { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .02em; }
.brand b { color: var(--gold); font-weight: 400; }
.brand i { color: var(--mud); font-style: normal; }
.crumb { font-size: 13px; color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; }

/* hero on home */
.hero { display: grid; grid-template-columns: 1fr 1fr; border-radius: 18px; overflow: hidden; border: 1.5px solid var(--line); }
.hero > div { padding: 28px 24px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero .gold { background: var(--gold-soft); }
.hero .mud { background: var(--mud-soft); }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 54px); line-height: 1.1; }
.hero .gold h2 { color: var(--gold); }
.hero .mud h2 { color: var(--mud); }
.hero p { font-size: 15px; max-width: 34ch; }
.lead { font-size: 15px; color: var(--muted); max-width: 70ch; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 18px; }
.card .sub { font-size: 14px; color: var(--muted); }
.card .grow { flex: 1; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.notice.warn { color: var(--bad); }

.btn { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; background: var(--fg); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.gold { background: var(--gold); color: #1b1508; }
.btn.mud { background: var(--mud); color: var(--bg); }
.btn.big { font-size: 18px; padding: 16px 22px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1.5px solid var(--line); }
.rules > div { padding: 14px 14px 0 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; min-width: 0; }
.rules .k { font-family: var(--display); font-size: 20px; color: var(--mud); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.qhead { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.tag { display: inline-block; font-size: 12px; letter-spacing: .06em; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.qtext { font-size: clamp(20px, 2.6vw, 30px); font-weight: 700; line-height: 1.4; }
.qjp { font-family: var(--jp); font-size: clamp(19px, 2.4vw, 28px); line-height: 1.6; padding: 14px 16px; background: var(--surface-2); border-radius: 12px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { display: flex; gap: 12px; align-items: center; text-align: left; border-radius: 14px; padding: 14px 16px; border: 2px solid var(--line); background: var(--surface); font-size: clamp(16px, 1.9vw, 22px); min-width: 0; }
.choice .kana { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--jp); font-weight: 700; color: #fff; font-size: 20px; }
.choice .txt { min-width: 0; overflow-wrap: anywhere; }
.choice.k0 .kana { background: var(--c0); } .choice.k1 .kana { background: var(--c1); }
.choice.k2 .kana { background: var(--c2); } .choice.k3 .kana { background: var(--c3); }
.choice.right { border-color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
.choice.wrong { opacity: .5; }
.choice.mine { border-color: var(--fg); }
.choice .cnt { margin-left: auto; font-weight: 700; font-size: 16px; color: var(--muted); }
.timer { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timer > i { display: block; height: 100%; background: var(--gold); transition: width .25s linear; }
.explain { border-left: 4px solid var(--good); padding: 4px 0 4px 14px; font-size: 16px; }
.explain .ts { color: var(--muted); font-size: 13px; }

/* ledger */
.ledger { display: flex; flex-direction: column; gap: 0; }
.ledger h3 { font-size: 14px; letter-spacing: .08em; color: var(--muted); font-weight: 500; padding-bottom: 8px; border-bottom: 1.5px solid var(--line); display: flex; justify-content: space-between; }
.lrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.lrow .rk { color: var(--muted); font-size: 13px; }
.lrow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .sc { display: flex; gap: 6px; align-items: center; font-size: 15px; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
.pill.pot { background: var(--gold-soft); color: var(--gold); }
.pill.bank { background: var(--mud-soft); color: var(--mud); }
.pill.ok { background: transparent; color: var(--good); }
.pill.lost { background: transparent; color: var(--bad); }
.pill.wait { background: transparent; color: var(--muted); }

/* local team input */
.teams { display: flex; flex-direction: column; gap: 8px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.trow .nm { font-weight: 700; overflow-wrap: anywhere; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 44px; height: 40px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--jp); font-weight: 700; padding: 0 10px; }
.seg button.on { color: #fff; border-color: transparent; }
.seg button.on.k0 { background: var(--c0); } .seg button.on.k1 { background: var(--c1); }
.seg button.on.k2 { background: var(--c2); } .seg button.on.k3 { background: var(--c3); }
.seg button.on.gold { background: var(--gold); color: #1b1508; }
.seg button.on.mud { background: var(--mud); color: var(--bg); }

/* lobby */
.code { font-family: var(--display); font-size: clamp(56px, 12vw, 120px); letter-spacing: .12em; line-height: 1; color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 6px 12px; border-radius: 99px; background: var(--surface-2); font-size: 15px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* phone */
.phone { max-width: 520px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.phone .choices { grid-template-columns: 1fr; }
.phone .choice { font-size: 18px; padding: 16px; }
.wallet { display: grid; grid-template-columns: 1fr 1fr; border-radius: 14px; overflow: hidden; border: 1.5px solid var(--line); }
.wallet > div { padding: 12px 14px; display: flex; flex-direction: column; }
.wallet .l { font-size: 12px; letter-spacing: .06em; }
.wallet .v { font-size: 26px; font-weight: 700; }
.wallet .g { background: var(--gold-soft); color: var(--gold); }
.wallet .m { background: var(--mud-soft); color: var(--mud); }
.verdict { font-family: var(--display); font-size: 40px; line-height: 1.1; }
.verdict.ok { color: var(--good); } .verdict.ng { color: var(--bad); }
.decide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.decide button { border-radius: 14px; padding: 16px 12px; border: 2px solid transparent; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; }
.decide .dg { background: var(--gold-soft); color: var(--gold); }
.decide .dm { background: var(--mud-soft); color: var(--mud); }
.decide .sel { border-color: var(--fg); }
.decide b { font-family: var(--display); font-weight: 400; font-size: 24px; }
.decide span { font-size: 13px; color: var(--fg); }

/* end */
.podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.award { border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); min-width: 0; }
.award .ttl { font-family: var(--display); font-size: 24px; }
.award .who { font-size: 20px; font-weight: 700; overflow-wrap: anywhere; }
.award .why { font-size: 14px; color: var(--muted); }
.award.a1 .ttl { color: var(--mud); } .award.a2 .ttl { color: var(--good); } .award.a3 .ttl { color: var(--gold); }

@media (max-width: 860px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .cards, .podium { grid-template-columns: 1fr; }
  .rules { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; }
  .choices { grid-template-columns: 1fr; }
  .trow { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .timer > i { transition: none; } }
</style>

/* ---------- 점수 규칙 ----------
   정답: 걸린 상자가 비어 있으면 +100, 이미 있으면 ×2.
   오답: 상자(아직 확정 안 한 점수)를 전부 잃음.
   정답 공개 뒤 「泥の中」를 고르면 상자 점수를 확정(bank), 「黄金の箱」면 계속 건다(기본값).
   게임이 끝나면 남은 상자 점수는 살아남은 것으로 보고 확정한다. */
function tally(p, order, n, applyLast, final) {
  let bank = 0, pot = 0, lost = 0, maxLost = 0, banks = 0, correct = 0;
  const ans = p.answers || {}, dec = p.banks || {};
  for (let i = 0; i < n; i++) {
    const q = QMAP[order[i]];
    if (!q) continue;
    if (ans[i] === q.a) { correct++; pot = pot > 0 ? pot * 2 : BASE; }
    else { if (pot > 0) { lost += pot; maxLost = Math.max(maxLost, pot); } pot = 0; }
    if ((i < n - 1 || applyLast) && dec[i] === true && pot > 0) { bank += pot; pot = 0; banks++; }
  }
  if (final) { bank += pot; pot = 0; }
  return { bank, pot, lost, maxLost, banks, correct, total: bank + pot };
}

function standings(g, players) {
  const n = g.phase === "end" ? g.order.length : g.phase === "reveal" ? g.qi + 1 : g.phase === "question" ? g.qi : 0;
  const applyLast = g.phase === "question" || g.phase === "end";
  return players.map(p => ({ p, t: tally(p, g.order, n, applyLast, g.phase === "end") }))
    .sort((a, b) => b.t.total - a.t.total || b.t.correct - a.t.correct || String(a.p.name).localeCompare(String(b.p.name)));
}

function ledger(g, players, local) {
  const st = standings(g, players);
  const qi = g.qi;
  const rows = st.map((s, i) => {
    const p = s.p, t = s.t;
    let flag = "";
    if (g.phase === "question") flag = (p.answers || {})[qi] != null ? `<span class="pill ok">답함</span>` : `<span class="pill wait">…</span>`;
    else if (g.phase === "reveal") {
      const q = QMAP[g.order[qi]];
      const right = (p.answers || {})[qi] === q.a;
      flag = right ? `<span class="pill ok">○</span>` : `<span class="pill lost">×</span>`;
      if (t.pot > 0 && (p.banks || {})[qi] === true) flag += `<span class="pill bank">泥</span>`;
    }
    const pot = t.pot > 0 ? `<span class="pill pot tnum" title="아직 확정 안 한 상자 점수">箱 ${fmt(t.pot)}</span>` : "";
    return `<div class="lrow"><span class="rk tnum">${i + 1}</span><span class="nm">${esc(p.name)}</span>
      <span class="sc tnum">${flag}${pot}<b>${fmt(t.bank)}</b></span></div>`;
  }).join("");
  return `<div class="ledger"><h3><span>${local ? "팀" : "참가자"} ${players.length}</span><span>확정 점수</span></h3>${rows || `<p class="notice" style="margin-top:10px">아직 아무도 없어요.</p>`}</div>`;
}

    ${q.jp ? `<p class="qjp">${esc(q.jp)}</p>` : ""}
    <div class="choices">${choices}</div>
    ${reveal ? `<div class="explain">${esc(q.ex)} <span class="ts">— 본문 ${q.ts}</span></div>` : ""}
    ${controls}
    <div class="row">${action}</div>
    ${reveal && !last && !local ? `<p class="notice">휴대폰에서 泥の中(확정) 또는 黄金の箱(계속)를 고를 시간을 주세요. 안 고르면 계속 거는 걸로 처리돼요.</p>` : ""}
  </div>${ledger(g, players, local)}</div>`;
}

function localControls(g, players, q, reveal, last) {
  const rows = players.map((p, pi) => {
    if (!reveal) {
      const cur = (p.answers || {})[g.qi];
      return `<div class="trow"><span class="nm">${esc(p.name)}</span><div class="seg">${KANA.map((k, i) =>
        `<button class="k${i} ${cur === i ? "on" : ""}" data-act="l-ans" data-p="${pi}" data-c="${i}" aria-label="${esc(p.name)} ${k}">${k}</button>`).join("")}</div></div>`;
    }
    if (last) return "";
    const t = tally(p, g.order, g.qi + 1, false, false);
    if (t.pot <= 0) return "";
    const banked = (p.banks || {})[g.qi] === true;
    return `<div class="trow"><span class="nm">${esc(p.name)} <span class="pill pot tnum">箱 ${fmt(t.pot)}</span></span><div class="seg">
      <button class="mud ${banked ? "on" : ""}" data-act="l-bank" data-p="${pi}" data-v="1">泥の中 확정</button>
      <button class="gold ${!banked ? "on" : ""}" data-act="l-bank" data-p="${pi}" data-v="0">黄金の箱 계속</button></div></div>`;
  }).join("");
  if (!rows) return reveal && !last ? `<p class="notice">상자를 가진 팀이 없어요.</p>` : "";
  return `<div class="teams">${reveal ? `<p class="crumb">상자를 가진 팀: 확정할까요, 계속 걸까요?</p>` : `<p class="crumb">팀별 답 입력</p>`}${rows}</div>`;
}

function endView(g, players) {
  const st = standings(g, players);
  const win = st[0];
  const bySat = st.slice().sort((a, b) => b.t.banks - a.t.banks || b.t.total - a.t.total)[0];
  const byLost = st.slice().sort((a, b) => b.t.maxLost - a.t.maxLost)[0];
  const aw = [];
  if (win) aw.push(`<div class="award a1"><span class="ttl jp">泥の中で生きた亀</span><span class="who">${esc(win.p.name)}</span><span class="why">최종 1위 · ${fmt(win.t.total)}점 · ${win.t.correct}문제 정답</span></div>`);
  if (bySat && bySat.t.banks > 0) aw.push(`<div class="award a2"><span class="ttl jp">知足常楽賞</span><span class="who">${esc(bySat.p.name)}</span><span class="why">泥の中를 ${bySat.t.banks}번 골랐어요. 족함을 아는 사람.</span></div>`);
  if (byLost && byLost.t.maxLost > 0) aw.push(`<div class="award a3"><span class="ttl jp">黄金の箱の亀賞</span><span class="who">${esc(byLost.p.name)}</span><span class="why">한 번에 ${fmt(byLost.t.maxLost)}점을 상자째 잃었어요.</span></div>`);
  const table = st.map((s, i) => `<div class="lrow"><span class="rk tnum">${i + 1}</span><span class="nm">${esc(s.p.name)}</span>
    <span class="sc tnum"><span class="pill wait">정답 ${s.t.correct} · 확정 ${s.t.banks}회 · 잃음 ${fmt(s.t.lost)}</span><b>${fmt(s.t.total)}</b></span></div>`).join("");
  return `<div class="panel">
    <h2 class="jp" style="font-family:var(--display);font-weight:400;font-size:34px">終わり</h2>
    <div class="podium">${aw.join("")}</div>
    <div class="ledger"><h3><span>최종 순위</span><span>점수</span></h3>${table}</div>
    <p class="lead">마지막 질문 하나 가져가세요: もし明日、世界中の人々が足るを知ってしまったら、この社会はどうなるでしょうか。</p>
    <div class="row">${S.view === "local" ? `<button class="btn gold" data-act="local-again">같은 팀으로 한 판 더</button>` : `<button class="btn gold" data-act="again">같은 방에서 한 판 더</button>`}</div>
  </div>`;
}

function playerView() {
  const g = S.game, me = S.me;
  if (!g || !me) return `<div class="phone"><div class="panel"><p>방에 들어가는 중…</p></div></div>`;
  const n = g.phase === "end" ? g.order.length : g.phase === "reveal" ? g.qi + 1 : g.phase === "question" ? g.qi : 0;
  const t = tally(me, g.order, n, g.phase !== "reveal", g.phase === "end");
  const wallet = `<div class="wallet"><div class="g"><span class="l jp">黄金の箱 (걸린 점수)</span><span class="v tnum">${fmt(t.pot)}</span></div>
    <div class="m"><span class="l jp">泥の中 (확정 점수)</span><span class="v tnum">${fmt(t.bank)}</span></div></div>`;
  const hello = `<p class="crumb">${esc(me.name)} · 방 ${esc(S.code)}</p>`;

  if (g.phase === "lobby") return `<div class="phone">${hello}<div class="panel"><p class="verdict jp" style="color:var(--mud)">待機中</p><p>참가 완료! 진행자가 시작하면 문제가 나와요.</p><p class="notice">정답이면 상자에 100점, 이어서 맞히면 두 배. 틀리면 상자가 사라져요. 정답 공개 뒤 확정할지 골라요.</p></div></div>`;

  if (g.phase === "end") {
    const st = standings(g, S.players);
    const rank = st.findIndex(s => s.p.uid === S.uid) + 1;
    return `<div class="phone">${hello}<div class="panel"><p class="verdict jp" style="color:var(--mud)">終わり</p>
      <p style="font-size:20px"><b>${rank || "-"}위</b> / ${st.length}명 · <b class="tnum">${fmt(t.total)}</b>점</p>
      <p class="sub">정답 ${t.correct}개 · 泥の中 ${t.banks}번 · 상자째 잃은 점수 ${fmt(t.lost)}</p>
      <p class="notice">결과와 상은 진행자 화면에서 확인하세요.</p></div></div>`;
  }

  const q = QMAP[g.order[g.qi]];
  const myAns = S.pendingAns && S.pendingAns.qi === g.qi ? S.pendingAns.c : (me.answers || {})[g.qi];
  const last = g.qi === g.order.length - 1;
  if (g.phase === "question") {
    return `<div class="phone">${hello}${wallet}<div class="panel">
      <div class="qhead"><span><span class="tag">${esc(q.cat)}</span> 문제 ${g.qi + 1}/${g.order.length}${last ? " · 마지막" : ""}</span></div>
      <p style="font-size:19px;font-weight:700">${esc(q.q)}</p>${q.jp ? `<p class="qjp" style="font-size:18px">${esc(q.jp)}</p>` : ""}
      <div class="choices">${q.c.map((c, i) => `<button class="choice k${i} ${myAns === i ? "mine" : ""}" data-act="answer" data-c="${i}">
        <span class="kana">${KANA[i]}</span><span class="txt jp">${esc(c)}</span>${myAns === i ? `<span class="cnt">✓</span>` : ""}</button>`).join("")}</div>
      <p class="sub">${myAns != null ? "답을 냈어요. 공개 전까지는 바꿀 수 있어요." : "하나를 고르세요."}</p></div></div>`;
  }
  // reveal
  const right = (me.answers || {})[g.qi] === q.a;
  const before = tally(me, g.order, g.qi, true, false);
  const banked = (me.banks || {})[g.qi] === true;
  let decide = "";
  if (!last && t.pot > 0) {
    decide = `<p class="crumb">다음 문제 전에 고르세요 (안 고르면 黄金の箱)</p><div class="decide">
      <button class="dm ${banked ? "sel" : ""}" data-act="bank" data-v="1"><b class="jp">泥の中</b><span>${fmt(t.pot)}점 확정하기</span></button>
      <button class="dg ${!banked ? "sel" : ""}" data-act="bank" data-v="0"><b class="jp">黄金の箱</b><span>계속 걸기 · 맞히면 ${fmt(t.pot * 2)}</span></button></div>`;
  } else if (last) decide = `<p class="notice">마지막 문제였어요. 결과를 기다려요.</p>`;
  return `<div class="phone">${hello}${wallet}<div class="panel">
    <p class="verdict jp ${right ? "ok" : "ng"}">${right ? "正解" : "不正解"}</p>
    <p>${right ? (before.pot > 0 ? `상자가 ${fmt(before.pot)} → ${fmt(t.pot)}점으로 불어났어요.` : `상자에 ${fmt(t.pot)}점이 들어왔어요.`) : (before.pot > 0 ? `상자에 있던 ${fmt(before.pot)}점이 사라졌어요.` : "이번엔 놓쳤어요.")}</p>
    <p class="sub">정답: <b class="jp">${KANA[q.a]} ${esc(q.c[q.a])}</b></p>
    ${decide}</div></div>`;
}

/* ---------- 타이머 (진행자 화면) ---------- */
let timerId = null, autoRevealing = false;
function tick() {
  clearInterval(timerId); timerId = null;
  const g = G();
  if (!(S.view === "host" || S.view === "local") || !g || g.phase !== "question") return;
  const started = S.qStartLocal || Date.now();
  const step = () => {
    const left = Math.max(0, QTIME - (Date.now() - started) / 1000);
    const bar = document.getElementById("tbar"), tl = document.getElementById("tleft");
    if (bar) bar.style.width = (left / QTIME * 100) + "%";
    if (tl) tl.textContent = left > 0 ? Math.ceil(left) + "초" : "시간 끝";
    if (S.view === "host" && !autoRevealing) {
      const players = P();
      const all = players.length && players.every(p => (p.answers || {})[g.qi] != null);
      if (left <= 0 || all) { autoRevealing = true; setPhase({ phase: "reveal" }).finally(() => { autoRevealing = false; }); }
    }
    if (left <= 0 && S.view === "local") { clearInterval(timerId); timerId = null; }
  };
  step();
  timerId = setInterval(step, 250);
}

/* ---------- 온라인: db ---------- */
async function boot() {
  try {
    const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
    S.db = db; S.user = user;
    if (user) {
      S.uid = await user.id();
      S.canWrite = await user.can("data.write");
    }
  } catch (e) { S.db = null; }
  S.ready = true;
  if (S.view === "home") render();
}

function gameRef(code) { return S.db.doc("games/" + code); }
function playersCol(code) { return S.db.collection("games/" + code + "/players"); }

function subscribeRoom(code, asPlayer) {
  clearSubs();
  S.code = code; S.game = null; S.players = []; S.me = null;
  let lastQKey = null;
  unsubs.push(gameRef(code).onSnapshot(snap => {
    S.game = snap.exists ? snap.data() : null;
    const g = S.game;
    const key = g ? g.phase + ":" + g.qi : null;
    if (g && g.phase === "question" && key !== lastQKey) S.qStartLocal = g.qAt && Math.abs(Date.now() - g.qAt) < QTIME * 1000 ? g.qAt : Date.now();
    if (key !== lastQKey) S.pendingAns = null;
    lastQKey = key;
    render();
  }, e => { S.joinErr = "방 연결이 끊겼어요. 다시 참가해 주세요."; S.view = "home"; render(); }));
  unsubs.push(playersCol(code).onSnapshot(snap => {
    S.players = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    if (asPlayer) S.me = S.players.find(p => p.uid === S.uid) || S.me;
    render();
  }, () => {}));
}

async function createRoom(count) {
  if (S.busy) return; S.busy = true;
  try {
    let code = newCode();
    for (let i = 0; i < 5; i++) {
      const s = await gameRef(code).get();
      if (!s.exists || Date.now() - (s.data().createdAt || 0) > 12 * 3600e3) break;
      code = newCode();
    }
    const order = shuffle(QUESTIONS.map(q => q.id)).slice(0, count);
    await gameRef(code).set({ hostId: S.uid, phase: "lobby", qi: 0, order, createdAt: Date.now(), qAt: 0 });
    ls.set("kq-host", code);
    S.view = "host"; subscribeRoom(code, false);
  } catch (e) {
    S.joinErr = e && e.code === "invalid_argument" ? "방을 만들 권한이 없어요. 한 화면 모드를 써 주세요." : "방을 만들지 못했어요. 잠시 뒤 다시 해 주세요.";
    render();
  } finally { S.busy = false; }
}

async function resumeHost() {
  const code = ls.get("kq-host");
  if (!code) return;
  const s = await gameRef(code).get().catch(() => null);
  if (!s || !s.exists) { ls.set("kq-host", null); S.joinErr = "이전 방을 찾지 못했어요."; render(); return; }
  S.view = "host"; subscribeRoom(code, false);
}

async function setPhase(patch) {
  const g = S.game; if (!g) return;
  try { await gameRef(S.code).update(patch); } catch (e) { /* 다음 스냅숏이 실제 상태를 보여 줌 */ }
}

async function joinRoom(code, name) {
  code = code.trim().toUpperCase(); name = name.trim();
  S.joinErr = "";
  if (!/^[A-Z]{4}$/.test(code)) { S.joinErr = "방 코드는 영문 4글자예요."; render(); return; }
  if (!name) { S.joinErr = "이름을 입력하세요."; render(); return; }
  if (S.busy) return; S.busy = true;
  try {
    const gs = await gameRef(code).get();
    if (!gs.exists) { S.joinErr = "그 코드의 방이 없어요. 진행자 화면의 코드를 다시 확인하세요."; return; }
    const ref = playersCol(code).doc(S.uid);
    const mine = await ref.get();
    if (mine.exists) await ref.update({ name });
    else await ref.set({ name, joinedAt: Date.now(), answers: {}, banks: {} });
    ls.set("kq-name", name);
    S.view = "player"; subscribeRoom(code, true);
  } catch (e) {
    S.joinErr = e && e.code === "invalid_argument" ? "이 링크 권한으로는 답을 낼 수 없어요. 진행자에게 '참여자' 권한을 요청하거나 한 화면 모드를 쓰세요." : "참가하지 못했어요. 잠시 뒤 다시 해 주세요.";
  } finally { S.busy = false; render(); }
}

let writeChain = Promise.resolve();
function writeMe(patch) {
  // 같은 문서에는 한 번에 하나씩
  writeChain = writeChain.then(() => playersCol(S.code).doc(S.uid).update(patch)).catch(() => {});
  return writeChain;
}

/* ---------- 한 화면 모드 ---------- */
function localStart(names, count) {
  const players = names.map((n, i) => ({ uid: "t" + i, name: n, answers: {}, banks: {} }));
  const order = shuffle(QUESTIONS.map(q => q.id)).slice(0, count);
  S.local = { game: { phase: "question", qi: 0, order }, players };
  S.qStartLocal = Date.now();
  S.view = "local"; render();
}
function localPhase(patch) {
  Object.assign(S.local.game, patch);
  if (patch.phase === "question") S.qStartLocal = Date.now();
  render();
}

/* ---------- 이벤트 ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const g = G();
  switch (act) {
    case "home": clearSubs(); S.view = "home"; S.joinErr = ""; render(); break;
    case "create": createRoom(+document.getElementById("cnt-host").value); break;
    case "resume-host": resumeHost(); break;
    case "join": joinRoom(document.getElementById("join-code").value, document.getElementById("join-name").value); break;
    case "local-setup": S.view = "local-setup"; render(); break;
    case "local-start": {
      const ta = document.getElementById("teams").value;
      S.teamsDraft = ta;
      const names = ta.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 12);
      if (names.length) localStart(names, +document.getElementById("cnt-local").value);
      break;
    }
    case "start":
      if (S.view === "host") setPhase({ phase: "question", qi: 0, qAt: Date.now() });
      break;
    case "reveal":
      if (S.view === "local") localPhase({ phase: "reveal" }); else setPhase({ phase: "reveal" });
      break;
    case "next": {
      const last = g.qi >= g.order.length - 1;
      const patch = last ? { phase: "end" } : { phase: "question", qi: g.qi + 1, qAt: Date.now() };
      if (S.view === "local") localPhase(patch); else setPhase(patch);
      break;
    }
    case "again": {
      const order = shuffle(QUESTIONS.map(q => q.id)).slice(0, g.order.length);
      (async () => {
        // 이전 판 답을 지우고 새 판 시작
        for (const p of S.players) { try { await playersCol(S.code).doc(p.uid).update({ answers: null, banks: null }); } catch (e) {} }
        setPhase({ phase: "lobby", qi: 0, order });
      })();
      break;
    }
    case "local-again": localStart(S.local.players.map(p => p.name), S.local.game.order.length); break;
    case "l-ans": {
      const p = S.local.players[+b.dataset.p];
      p.answers[g.qi] = +b.dataset.c; render(); break;
    }
    case "l-bank": {
      const p = S.local.players[+b.dataset.p];
      p.banks[g.qi] = b.dataset.v === "1"; render(); break;
    }
    case "answer": {
      if (!S.game || S.game.phase !== "question") break;
      const c = +b.dataset.c, qi = S.game.qi;
      S.pendingAns = { qi, c }; render();
      writeMe({ answers: { [qi]: c } });
      break;
    }
    case "bank": {
      if (!S.game || S.game.phase !== "reveal") break;
      const qi = S.game.qi, v = b.dataset.v === "1";
      if (S.me) S.me = { ...S.me, banks: { ...(S.me.banks || {}), [qi]: v } };
      render();
      writeMe({ banks: { [qi]: v } });
      break;
    }
  }
});
app.addEventListener("input", e => {
  if (e.target.id === "join-code") { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, ""); S.joinCodeDraft = e.target.value; }
  if (e.target.id === "join-name") S.nameDraft = e.target.value;
  if (e.target.id === "teams") S.teamsDraft = e.target.value;
});
app.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.target.id === "join-code" || e.target.id === "join-name")) document.querySelector('[data-act="join"]')?.click();
});

render();
boot();
</script>
